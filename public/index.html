
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback | Sistema de comentarios</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Menú de navegación -->

    <nav class="navbar navbar-expand-lg bg-white border-bottom">

        <div class="container">

            <a class="navbar-brand fw-bold text-primary" href="#">
                Feedback.
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Tiendas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Categorías</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Ofertas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contactos</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Contenido principal -->

    <main class="container main-container py-5 flex-grow-1">

        <section class="mb-4">

            <span class="subtitle text-primary fw-bold">
                COMUNIDAD
            </span>

            <h1 class="fw-bold mt-2">
                Su opinión es importante.
            </h1>

            <p class="text-secondary">
                Comparte tu experiencia. Queremos escucharte.
            </p>

        </section>

        <!-- Formulario -->

        <section class="card border-0 shadow-sm rounded-4 mb-4">

            <div class="card-body p-4">

                <form id="commentForm">

                    <div class="mb-3">

                        <label for="nombre" class="form-label fw-semibold">
                            Su nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            placeholder="Escribe tu nombre"
                            maxlength="80"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label for="comentario" class="form-label fw-semibold">
                            Comentario
                        </label>

                        <textarea
                            class="form-control"
                            id="comentario"
                            name="comentario"
                            rows="5"
                            maxlength="500"
                            placeholder="Cuéntanos qué piensas..."
                            required
                        ></textarea>

                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">

                        <small class="text-secondary" id="charCount">
                            0 / 500 caracteres
                        </small>

                        <button
                            type="submit"
                            class="btn btn-primary px-4 py-2"
                            id="submitBtn">

                            Enviar comentario

                        </button>

                    </div>

                    <p id="message" class="mt-3 mb-0" role="status"></p>

                </form>

            </div>

        </section>

        <!-- Comentarios recibidos -->

        <section>

            <div class="d-flex justify-content-between align-items-center mb-3 gap-2">

                <h2 class="h5 fw-bold mb-0">
                    Comentarios recibidos
                </h2>

                <span class="badge rounded-pill text-bg-primary" id="commentCount">
                    0 comentarios
                </span>

            </div>

            <div id="commentsList"></div>

        </section>

    </main>

    <!-- Footer -->

    <footer class="text-center text-secondary py-4">

        <small>
            Feedback &copy; 2026 | Proyecto académico
        </small>

    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript personalizado -->
    <script src="script.js"></script>

</body>
</html>
